<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Desenho das áreas (ex.: material composto) por cima das vistas da aeronave.
     Componente do Streamlit sem build: fala com o site pelo protocolo de mensagens. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap');
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: #1F2430;
  font: 14px/1.4 'Source Sans 3', 'Source Sans Pro', system-ui, sans-serif; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .9rem; margin-bottom: .6rem; }
.legenda { display: flex; flex-wrap: wrap; gap: .4rem .9rem; align-items: center; }
.legenda .rot { font-family: Inter, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: #9AA1AD; }
.legenda .item { display: inline-flex; align-items: center; gap: .4rem; font-weight: 600; font-size: 13.5px; }
.legenda .cor { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; }
.legenda .qtd { color: #8A919C; font-weight: 400; }
.legenda .item.escolha { cursor: pointer; padding: 4px 9px; border-radius: 9px; border: 1px solid #E3E6EB;
  background: #fff; font-weight: 500; }
.legenda .item.escolha:hover { border-color: #FFB27F; }
.legenda .item.escolha.ativa { border-color: #FF6A13; box-shadow: 0 0 0 2px rgba(255,106,19,.18); font-weight: 600; }
.legenda .nova { font-size: 13px; color: #6B7280; padding: 4px 9px; border-radius: 9px; border: 1px dashed #D3D8DF;
  background: transparent; }
.form-legenda { display: none; align-items: center; gap: .45rem; flex-wrap: wrap; margin: -.1rem 0 .6rem; }
.form-legenda.on { display: flex; }
.form-legenda input[type=text] { font: inherit; padding: 6px 10px; border: 1px solid #E3E6EB; border-radius: 9px;
  outline: none; width: 220px; }
.form-legenda input[type=text]:focus { border-color: #FF6A13; box-shadow: 0 0 0 3px rgba(255,106,19,.15); }
.form-legenda input[type=color] { width: 38px; height: 32px; padding: 2px; border: 1px solid #E3E6EB;
  border-radius: 9px; background: #fff; cursor: pointer; }
.form-legenda .erro { color: #B42318; font-size: 12.5px; }
.detalhe select { font: inherit; padding: 6px 8px; border: 1px solid #E3E6EB; border-radius: 9px; background: #fff; }
.ferramentas { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; margin-left: auto; }
.grupo { display: inline-flex; border: 1px solid #E3E6EB; border-radius: 10px; overflow: hidden; background: #fff; }
.grupo button { border: 0; border-right: 1px solid #E3E6EB; border-radius: 0; }
.grupo button:last-child { border-right: 0; }
button { font: 500 13px 'Source Sans 3', system-ui, sans-serif; color: #3B4352; background: #fff;
  border: 1px solid #E3E6EB; border-radius: 10px; padding: 6px 11px; cursor: pointer;
  display: inline-flex; align-items: center; gap: .35rem; }
button:hover:not(:disabled) { color: #E85A05; border-color: #FFB27F; }
.grupo button:hover:not(:disabled) { border-color: #E3E6EB; }
button.ativo { background: rgba(255, 106, 19, .10); color: #E85A05; font-weight: 600; }
button.primario { background: #FF6A13; color: #fff; border-color: #FF6A13; font-weight: 600; }
button.primario:hover:not(:disabled) { background: #E85A05; color: #fff; }
button:disabled { opacity: .45; cursor: default; }
svg.ic { width: 15px; height: 15px; }
.estado { font-size: 12.5px; color: #8A919C; }
.estado.sujo { color: #B54708; font-weight: 600; }
.quadro { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid rgba(227, 230, 235, .85);
  background: linear-gradient(160deg, #F7F8FA 0%, #ECEFF3 100%); user-select: none; -webkit-user-select: none; }
.palco { position: relative; transform-origin: 0 0; will-change: transform; }
.quadro img { display: block; width: 100%; height: auto; pointer-events: none; }
.quadro.mover svg.camada, .quadro.ampliado:not(.desenhando) svg.camada { cursor: grab; }
.quadro.movendo svg.camada { cursor: grabbing !important; }
.zoom { position: absolute; right: 10px; bottom: 10px; z-index: 6; display: flex; align-items: center;
  background: rgba(255, 255, 255, .92); border: 1px solid #E3E6EB; border-radius: 10px; overflow: hidden;
  box-shadow: 0 6px 18px -10px rgba(30, 36, 48, .35); }
.zoom button { border: 0; border-radius: 0; padding: 5px 10px; min-width: 34px; justify-content: center;
  font-size: 15px; line-height: 1; background: transparent; }
.zoom button#zoom-valor { font-size: 12.5px; min-width: 52px; color: #5F6672; border-left: 1px solid #E3E6EB;
  border-right: 1px solid #E3E6EB; }
.aviso-zoom { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
  background: rgba(31, 36, 48, .38); color: #fff; font-size: 15px; font-weight: 600; pointer-events: none;
  opacity: 0; transition: opacity .2s ease; }
.aviso-zoom.on { opacity: 1; }
.quadro svg.camada { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.quadro.desenhando svg.camada { cursor: crosshair; }
polygon.area { stroke-width: calc(2px / var(--z, 1)); vector-effect: non-scaling-stroke; transition: fill-opacity .12s ease; }
polygon.area.realce { fill-opacity: .62 !important; }
polygon.area.sel { stroke-dasharray: 6 4; stroke-width: calc(2.5px / var(--z, 1)); }
polyline.rascunho { fill: none; stroke: #1F2430; stroke-width: calc(2px / var(--z, 1)); stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; }
polygon.area, polyline.rascunho, circle.vertice { pointer-events: none; }
circle.vertice { fill: #fff; stroke: #1F2430; stroke-width: calc(1.5px / var(--z, 1)); vector-effect: non-scaling-stroke; }
.dica { position: absolute; pointer-events: none; z-index: 5; background: #1F2430; color: #fff;
  padding: 6px 10px; border-radius: 9px; font-size: 13px; box-shadow: 0 8px 22px -10px rgba(0,0,0,.5);
  white-space: nowrap; transform: translate(12px, 12px); display: none; }
.dica b { font-weight: 600; display: flex; align-items: center; gap: .4rem; }
.dica .cor { width: 10px; height: 10px; border-radius: 3px; }
.dica span { color: #C9CED6; display: block; font-size: 12px; }
.detalhe { display: none; margin-top: .6rem; padding: .6rem .8rem; border-radius: 12px; background: #fff;
  border: 1px solid #E3E6EB; align-items: center; gap: .6rem; flex-wrap: wrap; }
.detalhe.on { display: flex; }
.detalhe label { font-size: 12.5px; color: #6B7280; }
.detalhe input { flex: 1; min-width: 180px; font: inherit; padding: 6px 10px; border: 1px solid #E3E6EB;
  border-radius: 9px; outline: none; }
.detalhe input:focus { border-color: #FF6A13; box-shadow: 0 0 0 3px rgba(255,106,19,.15); }
.ajuda { font-size: 12.5px; color: #8A919C; margin-top: .45rem; min-height: 1.1em; }
/* Notas com seta: a caixa fica do mesmo tamanho na tela em qualquer zoom. */
.notas { position: absolute; inset: 0; pointer-events: none; }
.nota { position: absolute; width: max-content; max-width: 230px; padding: 5px 10px; border-radius: 9px;
  background: #fff; color: #1F2430; border: 1px solid #C9CED6; font-size: 12.5px; line-height: 1.35;
  white-space: pre-wrap; overflow-wrap: anywhere; box-shadow: 0 6px 16px -8px rgba(30, 36, 48, .45);
  transform: translate(-50%, -50%) scale(calc(1 / var(--z, 1))); pointer-events: none; }
.nota.vazia { color: #9AA1AD; font-style: italic; }
.nota.sel { border-color: #FF6A13; box-shadow: 0 0 0 2px rgba(255, 106, 19, .22), 0 6px 16px -8px rgba(30, 36, 48, .45); }
.quadro.editando:not(.desenhando) .nota, .quadro.editando.modo-nota .nota { pointer-events: auto; cursor: move; }
.quadro.sem-notas .notas, .quadro.sem-notas g.seta { display: none; }
g.seta line, g.seta polygon, g.seta circle { pointer-events: none; vector-effect: non-scaling-stroke; }
g.seta line.halo { stroke: #fff; stroke-opacity: .85; stroke-width: calc(4px / var(--z, 1)); stroke-linecap: round; }
g.seta line.traco { stroke: #1F2430; stroke-width: calc(1.6px / var(--z, 1)); stroke-linecap: round; }
g.seta polygon { fill: #1F2430; stroke: #fff; stroke-width: calc(1px / var(--z, 1)); stroke-linejoin: round; }
g.seta circle { fill: #FF6A13; stroke: #fff; stroke-width: calc(1.5px / var(--z, 1)); }
g.seta.rascunho line.traco { stroke-dasharray: 5 4; }
.botao-notas { position: absolute; left: 10px; bottom: 10px; z-index: 6; display: none;
  background: rgba(255, 255, 255, .92); box-shadow: 0 6px 18px -10px rgba(30, 36, 48, .35); }
.botao-notas.on { display: inline-flex; }
</style>
</head>
<body>
<div class="barra">
  <div class="legenda" id="legenda"></div>
  <div class="ferramentas" id="ferramentas">
    <div class="grupo">
      <button data-modo="ver" title="Ver e escolher uma área">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.037 4.688a.495.495 0 0 1 .651-.651l16 6.5a.5.5 0 0 1-.063.947l-6.124 1.58a2 2 0 0 0-1.438 1.435l-1.579 6.126a.5.5 0 0 1-.947.063z"/></svg>Selecionar</button>
      <button data-modo="livre" title="Arraste o mouse contornando a área">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></svg>Mão livre</button>
      <button data-modo="pontos" title="Clique ponto a ponto; clique no primeiro ponto para fechar">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20 8 5l8 4 5 11z"/><circle cx="8" cy="5" r="1.5"/><circle cx="16" cy="9" r="1.5"/></svg>Pontos</button>
      <button data-modo="nota" title="Clique no ponto que a seta vai indicar e arraste até onde a nota deve ficar">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/><path d="M13 8H7"/><path d="M17 12H7"/></svg>Nota</button>
    </div>
    <button id="desfazer" title="Desfazer a última alteração">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/></svg>Desfazer</button>
    <button id="salvar" class="primario" disabled>Salvar áreas</button>
    <span class="estado" id="estado"></span>
  </div>
</div>
<div class="form-legenda" id="form-legenda">
  <input type="text" id="nova-nome" maxlength="40" placeholder="Nome da legenda, ex.: Material composto">
  <input type="color" id="nova-cor" value="#2E90FA" title="Cor da legenda">
  <button id="nova-ok" class="primario">Adicionar legenda</button>
  <button id="nova-cancelar">Cancelar</button>
  <span class="erro" id="nova-erro"></span>
</div>
<div class="quadro" id="quadro">
  <div class="palco" id="palco">
    <img id="imagem" alt="">
    <svg class="camada" id="camada" preserveAspectRatio="none"></svg>
    <div class="notas" id="notas"></div>
  </div>
  <div class="dica" id="dica"></div>
  <button class="botao-notas" id="botao-notas"></button>
  <div class="aviso-zoom" id="aviso-zoom">Use Ctrl + roda do mouse para dar zoom</div>
  <div class="zoom" title="Zoom (também com Ctrl + roda do mouse)">
    <button id="zoom-menos" title="Diminuir zoom">−</button>
    <button id="zoom-valor" title="Voltar para 100%">100%</button>
    <button id="zoom-mais" title="Aumentar zoom">+</button>
  </div>
</div>
<div class="detalhe" id="detalhe">
  <label for="legenda-area">Área selecionada:</label>
  <select id="legenda-area" title="Legenda desta área"></select>
  <input id="descricao" placeholder="Descrição (opcional), ex.: radome, carenagem da asa, flap">
  <button id="excluir">Excluir área</button>
</div>
<div class="detalhe" id="detalhe-nota">
  <label for="texto-nota">Nota selecionada:</label>
  <input id="texto-nota" maxlength="300" placeholder="Texto da nota, ex.: lixa 320 no composto do radome">
  <button id="excluir-nota">Excluir nota</button>
</div>
<div class="ajuda" id="ajuda"></div>
<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const ICONE_OLHO = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
  const ICONE_OLHO_FECHADO = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
  const $ = (id) => document.getElementById(id);
  const enviar = (tipo, dados) => window.parent.postMessage(
    Object.assign({ isStreamlitMessage: true, type: tipo }, dados), '*');

  let args = {}, versao = null, areas = [], historico = [], sujo = false;
  let legendas = [], novas = [], ativa = null, contadorNovas = 0;
  let modo = 'ver', selecionada = null, rascunho = null, arrastando = false, ultimoClique = null;
  // Zoom: a imagem e o desenho ficam num "palco" ampliado e deslocado dentro do quadro.
  let zoom = 1, tx = 0, ty = 0, pan = null, espaco = false, avisoTempo = null;
  // Notas: seta de um ponto da vista (alvo) até a caixa de texto (caixa), em coordenadas 0-1.
  let notas = [], notaSel = null, arrasteNota = null, rascunhoNota = null, notasOcultas = false;
  try { notasOcultas = localStorage.getItem('pint_notas_ocultas') === '1'; } catch (e) { /* sem storage */ }

  function legendaDe(id) {
    return legendas.find((l) => String(l.id) === String(id)) || { id: id, nome: 'Sem legenda', cor: '#98A2B3' };
  }
  function copia(lista) { return JSON.parse(JSON.stringify(lista)); }
  function guardar() { historico.push(copia({ areas: areas, notas: notas })); if (historico.length > 50) historico.shift(); }
  function escapar(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function marcarSujo() {
    sujo = true; atualizarBarra();
  }

  function altura() {
    enviar('streamlit:setFrameHeight', { height: Math.ceil(document.body.scrollHeight) + 4 });
  }

  function atualizarBarra() {
    const editar = !!args.editar;
    $('ferramentas').style.display = editar ? '' : 'none';
    document.querySelectorAll('[data-modo]').forEach((b) => b.classList.toggle('ativo', b.dataset.modo === modo));
    $('desfazer').disabled = !historico.length;
    $('salvar').disabled = !sujo;
    $('estado').textContent = sujo ? 'Alterações não salvas' : (areas.length || notas.length ? 'Tudo salvo' : '');
    $('estado').className = 'estado' + (sujo ? ' sujo' : '');
    $('quadro').classList.toggle('desenhando', editar && modo !== 'ver');
    $('quadro').classList.toggle('modo-nota', editar && modo === 'nota');
    $('quadro').classList.toggle('editando', editar);
    $('quadro').classList.toggle('sem-notas', notasOcultas);
    const bn = $('botao-notas');
    bn.classList.toggle('on', notas.length > 0);
    bn.innerHTML = (notasOcultas ? ICONE_OLHO : ICONE_OLHO_FECHADO)
      + (notasOcultas ? 'Mostrar notas' : 'Ocultar notas') + ' (' + notas.length + ')';
    const nota = editar && notaSel !== null && notas[notaSel];
    $('detalhe-nota').classList.toggle('on', !!nota);
    if (nota && document.activeElement !== $('texto-nota')) $('texto-nota').value = nota.texto || '';
    const sel = editar && selecionada !== null && areas[selecionada];
    $('detalhe').classList.toggle('on', !!sel);
    if (sel && document.activeElement !== $('descricao')) $('descricao').value = sel.descricao || '';
    if (sel) {
      const caixa = $('legenda-area');
      caixa.innerHTML = legendas.map((l) => '<option value="' + escapar(String(l.id)) + '">' + escapar(l.nome) + '</option>').join('');
      caixa.value = String(sel.legenda);
    }
    const dicaZoom = zoom > 1
      ? ' Para mover a imagem ampliada, arraste num espaço vazio em Selecionar ou segure a barra de espaço e arraste.'
      : ' Zoom: botões + e − ou Ctrl + roda do mouse.';
    $('ajuda').textContent = (!editar
      ? (areas.length ? 'Passe o mouse sobre a aeronave para ver as áreas.' : '')
      : !legendas.length ? 'Crie uma legenda (+ Nova legenda) para começar a desenhar.'
      : modo === 'livre' ? 'Desenhando com "' + legendaDe(ativa).nome + '": segure o botão do mouse e contorne a área. Ao soltar, a área é fechada.'
      : modo === 'pontos' ? 'Desenhando com "' + legendaDe(ativa).nome + '": clique para marcar os cantos. Clique no primeiro ponto (ou dê dois cliques) para fechar. Esc cancela.'
      : modo === 'nota' ? 'Nota: clique no ponto que a seta vai indicar e arraste até onde o texto deve ficar. Depois escreva a nota embaixo da imagem.'
      : 'Clique numa área ou nota para editar ou excluir. Arraste a nota para mudar de lugar, ou a bolinha laranja para mudar a ponta da seta. Para desenhar, escolha Mão livre, Pontos ou Nota.') + dicaZoom;
    desenharLegenda();
    altura();
  }

  function desenharLegenda() {
    const leg = $('legenda');
    leg.innerHTML = '';
    const editar = !!args.editar;
    const rot = document.createElement('span');
    rot.className = 'rot'; rot.textContent = editar ? 'Desenhar com' : 'Legenda';
    leg.appendChild(rot);
    // Vendo: só as legendas usadas nesta vista. Editando: todas, para escolher com qual desenhar.
    const lista = editar ? legendas : legendas.filter((l) => areas.some((a) => String(a.legenda) === String(l.id)));
    lista.forEach((l) => {
      const qtd = areas.filter((a) => String(a.legenda) === String(l.id)).length;
      const item = document.createElement('span');
      item.className = 'item' + (editar ? ' escolha' : '') + (editar && String(l.id) === String(ativa) ? ' ativa' : '');
      item.innerHTML = '<span class="cor"></span><span></span><span class="qtd"></span>';
      item.children[0].style.background = l.cor + '73';
      item.children[0].style.borderColor = l.cor;
      item.children[1].textContent = l.nome;
      item.children[2].textContent = qtd ? '· ' + qtd : '';
      if (editar) item.addEventListener('click', () => {
        // Escolher a legenda já deixa pronto para desenhar com ela.
        ativa = l.id; selecionada = null; soltarNota();
        if (modo === 'ver' || modo === 'nota') modo = 'livre';
        desenhar(); atualizarBarra();
      });
      leg.appendChild(item);
    });
    if (editar) {
      const nova = document.createElement('button');
      nova.className = 'nova'; nova.textContent = '+ Nova legenda';
      nova.addEventListener('click', () => {
        $('form-legenda').classList.add('on'); $('nova-erro').textContent = '';
        $('nova-cor').value = proximaCor(); $('nova-nome').focus(); altura();
      });
      leg.appendChild(nova);
    } else if (!lista.length) {
      leg.innerHTML = '';
    }
  }

  const CORES = ['#2E90FA', '#12B76A', '#7A5AF8', '#F04438', '#EE46BC', '#0BA5EC', '#F79009', '#475467'];
  function proximaCor() {
    return CORES.find((c) => !legendas.some((l) => l.cor.toLowerCase() === c.toLowerCase())) || CORES[legendas.length % CORES.length];
  }

  function adicionarLegenda() {
    const nome = $('nova-nome').value.trim().replace(/\s+/g, ' ');
    if (!nome) { $('nova-erro').textContent = 'Digite o nome da legenda.'; return; }
    const igual = legendas.find((l) => l.nome.toLowerCase() === nome.toLowerCase());
    if (igual) { ativa = igual.id; }
    else {
      const l = { id: 'nova' + (++contadorNovas), nome: nome, cor: $('nova-cor').value };
      legendas.push(l); novas.push(l); ativa = l.id; marcarSujo();
    }
    $('nova-nome').value = ''; $('form-legenda').classList.remove('on');
    if (modo === 'ver' || modo === 'nota') modo = 'livre';
    selecionada = null; soltarNota();
    desenhar(); atualizarBarra();
  }

  function pontosSvg(pontos) {
    const w = args.largura, h = args.altura;
    return pontos.map((p) => (p[0] * w).toFixed(1) + ',' + (p[1] * h).toFixed(1)).join(' ');
  }

  function desenhar() {
    const svg = $('camada');
    svg.setAttribute('viewBox', '0 0 ' + args.largura + ' ' + args.altura);
    svg.innerHTML = '';
    areas.forEach((a, i) => {
      const t = legendaDe(a.legenda);
      const pol = document.createElementNS(NS, 'polygon');
      pol.setAttribute('points', pontosSvg(a.pontos));
      pol.setAttribute('class', 'area' + (i === selecionada ? ' sel' : '') + (i === realce ? ' realce' : ''));
      pol.setAttribute('fill', t.cor);
