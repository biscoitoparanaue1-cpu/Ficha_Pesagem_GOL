name: E-mail da escala de plantão

# Toda segunda às 7h de Brasília (10h UTC) manda a escala da semana.
# Secrets: SUPABASE_DB_URL, EMAIL_PARA e POWER_AUTOMATE_URL (o envio sai pelo
# fluxo do Power Automate, porque a GOL bloqueia SMTP). Sem POWER_AUTOMATE_URL,
# usa SMTP_USER/SMTP_PASSWORD (variáveis opcionais SMTP_HOST e SMTP_PORT).
# Sem agendamento: o envio semanal agora é feito pelo Power Automate lendo o
# feed de publicar-escala-rss.yml. Este fica só para disparo manual.
on:
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enviar escala da semana
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
        run: |
          if [ -z "$EMAIL_PARA" ]; then
            echo "Cadastre o secret EMAIL_PARA com os destinatários."
            exit 1
          fi
          if [ -z "$POWER_AUTOMATE_URL" ] && { [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASSWORD" ]; }; then
            echo "Cadastre o secret POWER_AUTOMATE_URL (ou SMTP_USER e SMTP_PASSWORD) para enviar o e-mail."
            exit 1
          fi
          pip install --quiet "psycopg[binary]"
          python scripts/email_escala_plantao.py
