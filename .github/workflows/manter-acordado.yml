name: Manter o app acordado

# O Space gratuito dorme depois de 48 h sem acesso. Um acesso a cada 6 h
# mantém o app no ar mesmo em fins de semana e feriados.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Acessar o app
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" --retry 3 --retry-delay 20 \
            "${{ vars.APP_URL }}"
