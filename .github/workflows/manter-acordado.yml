name: Manter o app acordado

# O Streamlit Cloud dorme depois de 12 h sem visitas, o Space gratuito depois
# de 48 h e o Supabase gratuito é pausado depois de 7 dias sem uso. Um acesso
# a cada 4 h evita os três.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/manter-acordado.yml
      - scripts/acordar_streamlit.py

env:
  STREAMLIT_URL: ${{ vars.STREAMLIT_URL || 'https://fichapesagemgol-hzappr8mhhpubvwfu9hudqj.streamlit.app' }}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Acordar o app no Streamlit Cloud
        if: ${{ vars.STREAMLIT_URL != 'desligado' }}
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          python scripts/acordar_streamlit.py "$STREAMLIT_URL"

      - name: Acessar o app
        if: ${{ vars.APP_URL != '' }}
        run: |
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" --retry 3 --retry-delay 20 \
            "${{ vars.APP_URL }}"

      - name: Consultar o banco Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Secret SUPABASE_DB_URL não cadastrado; pulando."
            exit 0
          fi
          pip install --quiet "psycopg[binary]"
          python - <<'PY'
          import os
          import psycopg

          url = os.environ["SUPABASE_DB_URL"].replace("postgresql+psycopg://", "postgresql://")
          with psycopg.connect(url, prepare_threshold=None, connect_timeout=30) as conn:
              print("Banco respondeu:", conn.execute("SELECT count(*) FROM pesagens").fetchone()[0], "fichas")
          PY
